<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>뱀사다리 메이커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 위에 탭, 아래는 [놀이판 | 설정 패널] 2단. 좁은 화면에서는 판이 위, 패널이 아래. */
:root{
  --bg:#e9f0f3; --surface:#ffffff; --surface2:#f2f6f8; --ink:#14313b; --ink2:#4d6a75; --line:#c9d6dc;
  --accent:#d2451e; --accent-ink:#ffffff; --teal:#12707f; --teal-ink:#ffffff;
  --cell:#fffef9; --cell-line:#9db1b9;
  --shadow:0 1px 2px rgba(20,49,59,.08),0 8px 24px rgba(20,49,59,.08);
  --good:#1f8a4c; --bad:#c43232;
  --f-display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1b21; --surface:#16272f; --surface2:#1d3039; --ink:#e5f0f3; --ink2:#9db8c1; --line:#2c4550;
    --accent:#ff7a50; --accent-ink:#1d0f08; --teal:#3fb6c6; --teal-ink:#06222a;
    --cell:#22343d; --cell-line:#4a6672; --good:#4cc78a; --bad:#ff7b7b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1b21; --surface:#16272f; --surface2:#1d3039; --ink:#e5f0f3; --ink2:#9db8c1; --line:#2c4550;
  --accent:#ff7a50; --accent-ink:#1d0f08; --teal:#3fb6c6; --teal-ink:#06222a;
  --cell:#22343d; --cell-line:#4a6672; --good:#4cc78a; --bad:#ff7b7b; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:14px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
h1,h2,h3{margin:0}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;max-width:1240px;margin:0 auto 14px}
.brand{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.1}
.tabs{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:999px;border:1px solid var(--line)}
.tab{border:0;background:none;padding:8px 20px;border-radius:999px;font-weight:700;color:var(--ink2)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:18px;max-width:1240px;margin:0 auto;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.stage{min-width:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-bottom:10px}
.chip{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.zoom{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.zoom input{width:120px;accent-color:var(--teal)}
.bscroll{overflow:auto;max-height:90vh;border-radius:14px}
.msg{min-height:1.5em;margin:10px 0 0;font-size:14px;color:var(--ink2)}
.msg.bad{color:var(--bad)} .msg.good{color:var(--good)}

/* 놀이판 */
.board{position:relative;container-type:inline-size;--u:12.5;
  width:calc(var(--zoom,1) * min(100%, calc(76vh * var(--ar,1))));aspect-ratio:var(--ar,1);margin-inline:auto;
  border:3px solid var(--ink);border-radius:12px;background:var(--cell-line);box-shadow:var(--shadow);overflow:hidden;user-select:none;-webkit-user-select:none}
.board.paint{touch-action:none}
.grid{position:absolute;inset:0;display:grid}
.cell{position:relative;background:var(--cell);color:var(--ink);outline:1px solid var(--cell-line);outline-offset:-.5px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1cqw*.03);
  padding:calc(var(--u)*1cqw*.16) calc(var(--u)*1cqw*.05) calc(var(--u)*1cqw*.05);min-width:0;min-height:0;overflow:hidden;text-align:center}
.edit .cell{cursor:pointer}
.edit .cell:hover{filter:brightness(.95)}
.num{position:absolute;left:calc(var(--u)*1cqw*.06);top:calc(var(--u)*1cqw*.03);font-size:calc(var(--u)*1cqw*.15);font-weight:700;opacity:.65;line-height:1.1;font-family:var(--f-body)}
.txt{font-family:var(--f-display);font-size:calc(var(--u)*1cqw*.19*var(--tf,1));line-height:1.12;overflow-wrap:anywhere;word-break:keep-all;max-width:100%}
.ico{display:block;flex:none;width:calc(var(--u)*1cqw*.34*var(--is,1));height:calc(var(--u)*1cqw*.34*var(--is,1))}
.ico svg{display:block;width:100%;height:100%}
.cell.sel{outline:3px solid var(--accent);outline-offset:-3px;z-index:2}
.cell.pend{outline:3px dashed var(--teal);outline-offset:-3px;z-index:2}
.cell.target{z-index:2;animation:tgt .8s ease-in-out infinite alternate}
@keyframes tgt{from{box-shadow:inset 0 0 0 3px var(--accent)}to{box-shadow:inset 0 0 0 calc(var(--u)*1cqw*.1) var(--accent)}}
.jumps{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mlayer{position:absolute;inset:0;pointer-events:none}
.mp{position:absolute;width:calc(var(--u)*1cqw*.8*var(--sc,1));transform:translate(-50%,-62%);pointer-events:none;
  transition:left .22s ease,top .22s ease,width .2s ease}
.mp.notrans{transition:none}
.mp.grab{pointer-events:auto;cursor:grab;touch-action:none}
.mp.dragging{cursor:grabbing}
.mp-in{position:relative}
.mp-in svg{display:block;width:100%;height:auto;filter:drop-shadow(0 2px 2px rgba(0,0,0,.28))}
.ring{position:absolute;left:6%;right:6%;bottom:1%;height:15%;border:3px solid var(--accent);border-radius:50%;display:none}
.mp.active .ring{display:block}
.mp.active .mp-in{animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7%)}}
.rk{position:absolute;right:-8%;top:-6%;display:none;background:var(--accent);color:var(--accent-ink);border-radius:999px;
  font-size:calc(var(--u)*1cqw*.2);font-weight:700;line-height:1.3;padding:0 .4em;font-family:var(--f-body)}
.mp[data-rank] .rk{display:block}
@media (prefers-reduced-motion:reduce){.mp.active .mp-in,.cell.target{animation:none}.mp{transition:none}}

/* 주사위 */
.dicebox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-wrap:wrap;justify-content:center;
  gap:calc(var(--u)*1cqw*.14);width:max-content;max-width:72%;pointer-events:none;z-index:20;--ds:calc(var(--dsz,14)*1cqw)}
.dicebox.can{pointer-events:auto;cursor:pointer}
.dicebox.can:hover .die{transform:translateY(-3%)}
.die{width:var(--ds);height:var(--ds);background:linear-gradient(calc(135deg + var(--i,0)*70deg),#ff595e,#ff924c,#ffca3a,#8ac926,#1982c4,#6a4c93);border-radius:calc(var(--ds)*.2);
  box-shadow:0 2px 0 #c3ccd1,0 6px 14px rgba(0,0,0,.3);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:calc(var(--ds)*.1);transition:transform .15s}
.die i{display:block;border-radius:50%;margin:14%;background:transparent}
.die i.on{background:#fff;box-shadow:0 0 0 2px rgba(20,20,45,.6),0 1px 2px rgba(0,0,0,.4)}
.dicebox.rolling .die{animation:shake .16s linear infinite}
@keyframes shake{25%{transform:rotate(-8deg) translateY(-4%)}75%{transform:rotate(8deg) translateY(2%)}}
@media (prefers-reduced-motion:reduce){.dicebox.rolling .die{animation:none}}

/* 패널 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 16px 16px;box-shadow:var(--shadow);min-width:0}
.sec{padding-block:14px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.sec h3{font-family:var(--f-display);font-weight:400;font-size:19px;margin-bottom:8px}
.lbl{font-size:13px;font-weight:700;color:var(--ink2);margin:12px 0 6px}
.hint{font-size:13.5px;color:var(--ink2);margin:6px 0}
.rowf{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-block:8px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2)}
.step button{width:38px;height:36px;border:0;background:transparent;font-size:18px;font-weight:700}
.step button:hover:not(:disabled){background:var(--line)}
.step output{min-width:36px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2)}
.seg button{flex:1;padding:8px 6px;border:0;background:transparent;font-weight:500;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink);font-weight:700}
select,textarea,input[type=text]{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;resize:vertical}
.swrow{display:flex;flex-wrap:wrap;gap:7px}
.sw{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}
.sw.none{background:repeating-linear-gradient(135deg,var(--surface2) 0 5px,var(--line) 5px 7px)}
.crow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--ink2)}
input[type=color]{width:38px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);padding:2px}
.icons{display:flex;gap:7px;flex-wrap:wrap}
.ibtn{width:46px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface2);padding:6px;display:grid;place-items:center;font-size:12px}
.ibtn svg{width:100%;height:100%}
.ibtn[aria-pressed="true"]{border-color:var(--accent);background:var(--surface)}
.ins-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ins-head strong{font-family:var(--f-display);font-weight:400;font-size:18px}
.mini{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:5px 10px;font-size:13px}
.mini:hover{background:var(--line)}
.btnrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 14px;font-weight:700}
.btn:hover:not(:disabled){background:var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn.big{width:100%;padding:13px;font-size:17px;font-family:var(--f-display);font-weight:400}
.jlist,.plist,.log,.rank-list{list-style:none;margin:0;padding:0}
.jrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.jt{font-size:12px;font-weight:700;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.jn{flex:1;font-variant-numeric:tabular-nums}
details{margin-top:8px}
summary{cursor:pointer;font-weight:700;padding:6px 0}
.small{font-size:12.5px;color:var(--ink2)}

/* 게임 패널 */
.av{display:inline-block;width:38px;height:42px;flex:none}
.av svg{display:block;width:100%;height:100%}
.prow{display:grid;grid-template-columns:20px 44px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 0}
.prow .ord{font-weight:700;color:var(--ink2);text-align:center;font-variant-numeric:tabular-nums}
.avbtn{width:44px;height:48px;border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:3px}
.avbtn[aria-expanded="true"]{border-color:var(--accent)}
.avbtn svg{display:block;width:100%;height:100%}
.pname{width:100%}
.mv{display:flex;gap:4px}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;padding:8px;margin:2px 0 6px;background:var(--surface2);border-radius:10px;list-style:none}
.picker button{border:2px solid transparent;background:var(--surface);border-radius:10px;padding:3px;display:grid;justify-items:center;font-size:11px;color:var(--ink2)}
.picker button svg{width:36px;height:40px}
.picker button[aria-pressed="true"]{border-color:var(--accent)}
.turn{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.turn .big{font-family:var(--f-display);font-weight:400;font-size:22px;display:block;line-height:1.2}
.status{min-height:3em;margin:12px 0 4px;font-size:14.5px}
.plist li{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px}
.plist li.cur{background:var(--surface2);outline:2px solid var(--accent);outline-offset:-2px}
.plist .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.plist .pp{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.rank{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 9px;font-size:12.5px}
.log{font-size:13px;color:var(--ink2)}
.log li{padding:2px 0}
.modal{position:fixed;inset:0;background:rgba(8,20,26,.6);display:grid;place-items:center;padding:16px;z-index:100}
.modal .card{background:var(--surface);color:var(--ink);border-radius:16px;padding:22px;max-width:420px;width:100%;box-shadow:var(--shadow)}
.modal h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin-bottom:10px}
.rank-list li{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:17px;border-bottom:1px dashed var(--line)}
.rank-list b{min-width:2.6em}
</style>

<header class="top">
  <h1 class="brand">뱀사다리 메이커</h1>
  <nav class="tabs" role="tablist" aria-label="화면 선택">
    <button class="tab" role="tab" id="tabEdit" data-act="tab" data-v="edit" aria-selected="true">판 만들기</button>
    <button class="tab" role="tab" id="tabPlay" data-act="tab" data-v="play" aria-selected="false">게임하기</button>
  </nav>
</header>

<main>
  <div id="viewEdit" class="layout">
    <div class="stage">
      <div class="bar">
        <span class="chip" id="sizeInfo"></span>
        <label class="zoom">확대 <input type="range" class="zoomr" min="1" max="2.5" step=".25" value="1" aria-label="판 확대"></label>
      </div>
      <div class="bscroll"><div class="board edit" id="eb"></div></div>
      <p class="msg" id="editMsg" role="status" aria-live="polite"></p>
    </div>
    <aside class="panel">
      <div class="sec">
        <h3>판 크기</h3>
        <div id="sizeBox"></div>
      </div>
      <div class="sec">
        <h3>도구</h3>
        <div class="seg" id="toolSeg">
          <button data-act="tool" data-v="cell">칸 편집</button>
          <button data-act="tool" data-v="paint">색칠</button>
          <button data-act="tool" data-v="snake">뱀</button>
          <button data-act="tool" data-v="ladder">사다리</button>
        </div>
        <div id="toolBody"></div>
      </div>
      <div class="sec">
        <h3>뱀 · 사다리 목록</h3>
        <ul class="jlist" id="jumpList"></ul>
      </div>
      <div class="sec">
        <details>
          <summary>글을 한 번에 입력하기</summary>
          <p class="hint">한 줄이 한 칸이에요. 첫 줄이 1번 칸입니다.</p>
          <textarea id="bulkT" rows="6" placeholder="출발! 손뼉 3번&#10;개구리처럼 뛰기&#10;노래 한 소절"></textarea>
          <div class="btnrow"><button class="btn" data-act="bulk-load">현재 글 불러오기</button><button class="btn primary" data-act="bulk-apply">칸에 적용</button></div>
        </details>
        <details>
          <summary>판 저장 · 불러오기</summary>
          <p class="hint">이 브라우저에 자동 저장돼요. 다른 곳으로 옮기려면 글자를 복사해서 붙여 넣으세요.</p>
          <textarea id="expT" rows="4" aria-label="판 데이터"></textarea>
          <div class="btnrow"><button class="btn" data-act="exp-make">내보내기</button><button class="btn" data-act="exp-load">불러오기</button><button class="btn" data-act="reset-blank">백지로 비우기</button><button class="btn" data-act="reset-sample">예시 판 보기</button></div>
        </details>
      </div>
    </aside>
  </div>

  <div id="viewPlay" class="layout" hidden>
    <div class="stage">
      <div class="bar">
        <span class="chip" id="playInfo"></span>
        <label class="zoom">확대 <input type="range" class="zoomr" min="1" max="2.5" step=".25" value="1" aria-label="판 확대"></label>
      </div>
      <div class="bscroll"><div class="board play" id="pb"></div></div>
    </div>
    <aside class="panel" id="playSide"></aside>
  </div>
</main>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-label="게임 결과">
  <div class="card" id="modalBody"></div>
</div>

<script>
(function(){
'use strict';
/* ---------- 기본 도구 ---------- */
const KEY='snl-maker-v2';
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const RM=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const HEX=/^#[0-9a-f]{6}$/i;

function hexToRgb(h){h=h.replace('#','');const n=parseInt(h,16);return [(n>>16)&255,(n>>8)&255,n&255];}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('');}
function shade(h,k){const [r,g,b]=hexToRgb(h);return k<0?rgbToHex(r*(1+k),g*(1+k),b*(1+k)):rgbToHex(r+(255-r)*k,g+(255-g)*k,b+(255-b)*k);}
function lum(h){const c=hexToRgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function inkOn(h){return lum(h)>.4?'#14313b':'#ffffff';}
function hslHex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12;const a=s*Math.min(l,1-l);const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return rgbToHex(f(0)*255,f(8)*255,f(4)*255);}

/* ---------- 말 11종 (직접 디자인한 바다 친구들) ---------- */
const INK='#2a2430';
const eye=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff"/><circle cx="${x+r*.12}" cy="${y+r*.1}" r="${r*.58}" fill="${INK}"/><circle cx="${x+r*.34}" cy="${y-r*.18}" r="${r*.2}" fill="#fff"/>`;
const smile=(x,y,w)=>`<path d="M${x-w} ${y}Q${x} ${y+w*1.1} ${x+w} ${y}" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/>`;

function spikes(cx,cy,n,r1,r2,col,w,rot){let s='';for(let i=0;i<n;i++){const a=(rot||0)+i*2*Math.PI/n;s+=`<line x1="${(cx+Math.cos(a)*r1).toFixed(1)}" y1="${(cy+Math.sin(a)*r1).toFixed(1)}" x2="${(cx+Math.cos(a)*r2).toFixed(1)}" y2="${(cy+Math.sin(a)*r2).toFixed(1)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;}return s;}

function sanitizeBoard(o){
  try{
    if(!o||typeof o!=='object'||!o.cols||!o.rows) return null;
    const cols=clamp(parseInt(o.cols,10)||0,2,14), rows=clamp(parseInt(o.rows,10)||0,2,14), N=cols*rows;
    const cells=[];
    for(let i=0;i<N;i++){const c=(o.cells&&o.cells[i])||{};cells.push({t:String(c.t||'').slice(0,80),i:['heart','star','bomb','arrow'].indexOf(c.i)>=0?c.i:'',c:HEX.test(c.c||'')?c.c:''});}
    const jumps=[],used={};
    (o.jumps||[]).forEach(j=>{
      const type=j.type==='snake'?'snake':'ladder',from=parseInt(j.from,10),to=parseInt(j.to,10);
      if(!(from>=1&&from<N&&to>=1&&to<=N&&from!==to))return;
      if(type==='snake'&&to>=from)return; if(type==='ladder'&&to<=from)return;
      if(used[from])return; used[from]=1;
      jumps.push({id:++jid,type,from,to,color:HEX.test(j.color||'')?j.color:(type==='snake'?SNAKE_COLS[0]:LADDER_COLS[0])});
    });
    return {cols,rows,startRight:!!o.startRight,cells,jumps};
  }catch(e){return null;}
}
function sanitizeSetup(o){
  const d=defaultSetup(); if(!o||typeof o!=='object') return d;
  d.n=clamp(parseInt(o.n,10)||4,2,11); d.dice=clamp(parseInt(o.dice,10)||1,1,6);
  d.mode=o.mode==='manual'?'manual':'auto'; d.finish=o.finish==='exact'?'exact':'pass';
  if(Array.isArray(o.players)&&o.players.length===CHARS.length){
    const seen={},ok=o.players.every(p=>p&&Number.isInteger(p.char)&&p.char>=0&&p.char<CHARS.length&&!seen[p.char]&&(seen[p.char]=1));
    if(ok) d.players=o.players.map(p=>({char:p.char,name:String(p.name||'').slice(0,12)}));
  }
  return d;
}

function nToRC(n,b){const r=Math.floor((n-1)/b.cols),k=(n-1)%b.cols;const ltr=(r%2===0)!==b.startRight;return {col:ltr?k:b.cols-1-k,row:b.rows-1-r};}
function center(n,b){const q=nToRC(n,b);return {x:(q.col+.5)*100,y:(q.row+.5)*100};}
function cellAt(x,y,b){
  const col=clamp(Math.floor(x*b.cols),0,b.cols-1),row=clamp(Math.floor(y*b.rows),0,b.rows-1);
  const r=b.rows-1-row,ltr=(r%2===0)!==b.startRight,k=ltr?col:b.cols-1-col;return r*b.cols+k+1;
}
function arrowAngle(n,b){
  const N=b.cols*b.rows,a=n<N?center(n,b):center(n-1,b),c=n<N?center(n+1,b):center(n,b);
  return Math.round(Math.atan2(c.y-a.y,c.x-a.x)*180/Math.PI);
}
function cellFromEvent(e,host,b){
  const r=host.getBoundingClientRect();
  const x=(e.clientX-r.left-host.clientLeft)/host.clientWidth,y=(e.clientY-r.top-host.clientTop)/host.clientHeight;
  if(x<0||y<0||x>=1||y>=1)return 0; return cellAt(x,y,b);
}

/* ---------- 뱀과 사다리 그리기 ---------- */
function snakePts(a,c){
  const dx=c.x-a.x,dy=c.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,nx=-uy,ny=ux;
  const waves=Math.max(1,Math.round(L/150)),amp=Math.min(30,L*.14),n=Math.max(24,Math.round(L/5)),pts=[];
  for(let i=0;i<=n;i++){const t=i/n,env=Math.min(1,t/.14,(1-t)/.14),o=amp*env*Math.sin(Math.PI*2*waves*t);pts.push({x:a.x+dx*t+nx*o,y:a.y+dy*t+ny*o});}
  return pts;
}
function pathAt(pts,f){
  if(!pts.cum){let d=0;pts.cum=[0];for(let i=1;i<pts.length;i++){d+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);pts.cum.push(d);}}
  const tot=pts.cum[pts.cum.length-1],s=clamp(f,0,1)*tot;let i=1;
  while(i<pts.length-1&&pts.cum[i]<s)i++;
  const seg=(pts.cum[i]-pts.cum[i-1])||1,t=clamp((s-pts.cum[i-1])/seg,0,1);
  return {x:pts[i-1].x+(pts[i].x-pts[i-1].x)*t,y:pts[i-1].y+(pts[i].y-pts[i-1].y)*t};
}
function snakeSVG(j,b){

  const rad=i=>4.5+10.5*Math.pow(1-i/(n-1),.75);
  let s='<g>';
  for(let i=n-1;i>=0;i--)s+=`<circle cx="${pts[i].x.toFixed(1)}" cy="${pts[i].y.toFixed(1)}" r="${(rad(i)+2.2).toFixed(1)}" fill="${dk}"/>`;
  for(let i=n-1;i>=0;i--)s+=`<circle cx="${pts[i].x.toFixed(1)}" cy="${pts[i].y.toFixed(1)}" r="${rad(i).toFixed(1)}" fill="${col}"/>`;
  for(let i=3;i<n-3;i+=4)s+=`<circle cx="${pts[i].x.toFixed(1)}" cy="${pts[i].y.toFixed(1)}" r="${(rad(i)*.5).toFixed(1)}" fill="${dk}" opacity=".45"/>`;
  const h=pts[0],p1=pts[Math.min(3,n-1)],ang=(Math.atan2(h.y-p1.y,h.x-p1.x)*180/Math.PI).toFixed(1);
  s+=`<g transform="translate(${h.x.toFixed(1)} ${h.y.toFixed(1)}) rotate(${ang})"><path d="M18 0H30M30 0L36 -4M30 0L36 4" stroke="#e02d4c" stroke-width="2.2" stroke-linecap="round" fill="none"/><ellipse cx="4" cy="0" rx="20" ry="16.5" fill="${dk}"/><ellipse cx="4" cy="0" rx="17.6" ry="14.2" fill="${col}"/><circle cx="7" cy="-8" r="5.2" fill="#fff"/><circle cx="8.6" cy="-8" r="2.6" fill="#1b1b1b"/><circle cx="7" cy="8" r="5.2" fill="#fff"/><circle cx="8.6" cy="8" r="2.6" fill="#1b1b1b"/><circle cx="15" cy="-3" r="1.2" fill="${dk}"/><circle cx="15" cy="3" r="1.2" fill="${dk}"/></g></g>`;
  return s;
}
function ladderSVG(j,b){
  const a=center(j.from,b),c=center(j.to,b),dx=c.x-a.x,dy=c.y-a.y,L=Math.hypot(dx,dy)||1,nx=-dy/L*15,ny=dx/L*15;
  const col=j.color,dk=shade(col,-.45),cnt=Math.max(2,Math.round(L/34));
  const line=(x1,y1,x2,y2,st,w)=>`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${st}" stroke-width="${w}"/>`;
  let rails1='',rails2='',r1='',r2='';
  rails1=line(a.x+nx,a.y+ny,c.x+nx,c.y+ny,dk,11)+line(a.x-nx,a.y-ny,c.x-nx,c.y-ny,dk,11);
  rails2=line(a.x+nx,a.y+ny,c.x+nx,c.y+ny,col,7)+line(a.x-nx,a.y-ny,c.x-nx,c.y-ny,col,7);
  for(let i=0;i<cnt;i++){const t=(i+.5)/cnt,px=a.x+dx*t,py=a.y+dy*t;r1+=line(px+nx,py+ny,px-nx,py-ny,dk,9);r2+=line(px+nx,py+ny,px-nx,py-ny,col,5);}
  return `<g opacity=".96" stroke-linecap="round">${rails1}${r1}${rails2}${r2}</g>`;
}
function jumpsSVG(b){
  const W=b.cols*100,H=b.rows*100;
  let s=`<svg class="jumps" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">`;
  b.jumps.filter(j=>j.type==='ladder').forEach(j=>{s+=ladderSVG(j,b);});
  b.jumps.filter(j=>j.type==='snake').forEach(j=>{s+=snakeSVG(j,b);});
  return s+'</svg>';
}

function setDim(k,v){
  v=clamp(v,2,14);if(v===board[k])return;
  board[k]=v;const N=board.cols*board.rows;
  while(board.cells.length<N)board.cells.push({t:'',i:'',c:''});
  board.cells.length=N;
  const before=board.jumps.length;
  board.jumps=board.jumps.filter(j=>j.from<N&&j.to<=N);
  if(ui.sel>N)ui.sel=null;ui.pend=null;
  const lost=before-board.jumps.length;
  msgE(lost?`판이 작아져서 뱀·사다리 ${lost}개가 사라졌어요.`:'',lost?'bad':'');

function onEditCell(n){

    else if(narrow()){const tb=$('#toolBody');if(tb&&tb.scrollIntoView)tb.scrollIntoView({block:'nearest',behavior:'smooth'});}
  }else if(ui.tool==='snake'||ui.tool==='ladder'){jumpClick(n);}
}
function jumpClick(n){
  const type=ui.tool,N=board.cols*board.rows;
  if(!ui.pend){ui.pend={type,a:n};msgE(`${n}번 칸에서 시작해요.`);renderEditBoard();drawToolBody();return;}
  const a=ui.pend.a;
  if(a===n){ui.pend=null;msgE('취소했어요.');renderEditBoard();drawToolBody();return;}
  const lo=Math.min(a,n),hi=Math.max(a,n),from=type==='snake'?hi:lo,to=type==='snake'?lo:hi;
  ui.pend=null;
  if(from===N){msgE('마지막 칸에는 뱀 머리를 둘 수 없어요.','bad');renderEditBoard();drawToolBody();return;}
  if(board.jumps.some(j=>j.from===from)){msgE(`${from}번 칸에서는 이미 뱀이나 사다리가 시작돼요.`,'bad');renderEditBoard();drawToolBody();return;}
  board.jumps.push({id:++jid,type,from,to,color:type==='snake'?ui.snakeColor:ui.ladderColor});
  msgE(`${type==='snake'?'뱀':'사다리'}를 놓았어요: ${from}번 → ${to}번`,'good');
  save();renderEditBoard();drawToolBody();drawJumpList();updateInfo();
}
function applyPattern(v){

    else if(v==='rainbow')c.c=hslHex(Math.round((n-1)/N*300),75,86);

  }

}

function place(p,x,y,scale){
  const b=G.b,el=p.el;if(!el)return;

  Object.keys(groups).forEach(key=>{
    const arr=groups[key],c=center(+key,b),k=Math.ceil(Math.sqrt(arr.length)),rows=Math.ceil(arr.length/k),sp=arr.length===1?0:62/k,sc=arr.length===1?1:Math.max(.42,1.08/k);

<p class="hint">${setup.mode==='auto'?'주사위 눈만큼 말이 한 칸씩 걸어가요.':'주사위를 굴린 뒤 말을 끌어서 목표 칸에 놓거나, 반짝이는 칸을 눌러요.'}</p>
<div class="rowf"><label for="finishSel">끝 칸 규칙</label><select id="finishSel"><option value="pass"${setup.finish==='pass'?' selected':''}>넘어도 도착</option><option value="exact"${setup.finish==='exact'?' selected':''}>정확히 맞춰야 도착</option></select></div></div>
<div class="sec"><button type="button" class="btn primary big" data-act="start">게임 시작</button><p class="status" id="status" role="status" aria-live="polite">${esc(G.status||'말은 출발선에 서 있어요.')}</p></div>`;
}
function liveHTML(){
  const over=G.phase==='over',cur=G.players[G.turn];
  return `<div class="sec"><div class="turn">${over?'':`<span class="av">${charSVG(cur.char)}</span>`}<div><span class="small">${over?'게임 끝':'지금 차례'}</span><strong class="big">${over?'결과를 확인해요':esc(cur.name)}</strong></div></div>
<button type="button" class="btn primary big" data-act="roll" ${G.phase==='idle'?'':'disabled'}>주사위 굴리기</button>
<div class="lbl">말 움직이기</div>
<div class="seg"><button type="button" data-act="mode" data-v="auto" aria-pressed="${setup.mode==='auto'}">자동으로 걷기</button><button type="button" data-act="mode" data-v="manual" aria-pressed="${setup.mode==='manual'}">직접 옮기기</button></div>
<p class="status" id="status" role="status" aria-live="polite">${esc(G.status||'')}</p></div>
<div class="sec"><h3>순서와 위치</h3><ol class="plist">${G.players.map((p,i)=>`<li class="${i===G.turn&&!over?'cur':''}"><span class="av">${charSVG(p.char)}</span><span class="pn">${esc(p.name)}</span><span class="pp">${p.rank?`<b class="rank">${p.rank}등</b>`:p.pos+'번 칸'}</span></li>`).join('')}</ol></div>
<div class="sec"><h3>기록</h3><ul class="log" id="log">${G.log.slice(0,6).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="btnrow"><button type="button" class="btn" data-act="newgame">처음부터 다시</button></div></div>`;
}
function drawPlayPanel(){if(!G)return;$('#playSide').innerHTML=G.phase==='setup'?setupHTML():liveHTML();}
function syncAll(){syncMeepleStates();syncDice();if(G.phase!=='setup')drawPlayPanel();}
function afterSetupChange(){save();if(G&&G.phase==='setup'){buildGame();drawPlayBoard();drawPlayPanel();}}

/* ----- 게임 진행 ----- */
function planMove(pos,t,N,rule){
  const path=[];
  if(rule==='exact'&&pos+t>N){
    for(let i=pos+1;i<=N;i++)path.push(i);
    const back=pos+t-N;for(let k=1;k<=back;k++)path.push(Math.max(1,N-k));
    return {path,dest:path.length?path[path.length-1]:pos};
  }
  const d=Math.min(pos+t,N);for(let i=pos+1;i<=d;i++)path.push(i);
  return {path,dest:d};
}
async function wait(ms,gid){await sleep(RM?Math.min(ms,40):ms);return !!G&&G.id===gid;}
function hop(p){const inn=p.el&&$('.mp-in',p.el);if(inn&&inn.animate&&!RM)inn.animate([{transform:'translateY(0)'},{transform:'translateY(-28%)'},{transform:'translateY(0)'}],{duration:220,easing:'ease-out'});}
async function walk(p,cells,gid){
  for(const n of cells){
    const c=center(n,G.b);p.pos=n;p.override={x:c.x,y:c.y};layoutMeeples();hop(p);
    if(!await wait(230,gid))return false;
  }
  p.override=null;layoutMeeples();return true;
}
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
function glide(p,pts,dur,gid){
  return new Promise(res=>{
    p.el.classList.add('notrans');const t0=performance.now(),d=RM?30:dur;
    (function f(t){
      if(!G||G.id!==gid){res();return;}
      const k=Math.min(1,(t-t0)/d),q=pathAt(pts,ease(k));p.override={x:q.x,y:q.y};place(p,q.x,q.y+6,1);
      if(k<1)requestAnimationFrame(f);else res();
    })(t0);
  }).then(()=>{if(p.el)p.el.classList.remove('notrans');});
}
async function applyJump(p,gid){
  const j=G.b.jumps.find(x=>x.from===p.pos);if(!j)return true;
  const a=center(j.from,G.b),c=center(j.to,G.b);
  if(j.type==='snake'){say(`${p.name}: 뱀을 만났어요! ${j.to}번 칸으로 미끄러져요.`);const pts=snakePts(a,c);await glide(p,pts,1000,gid);}
  else{say(`${p.name}: 사다리예요! ${j.to}번 칸으로 올라가요.`);await glide(p,[a,c],850,gid);}
  if(!G||G.id!==gid)return false;
  p.pos=j.to;p.override=null;layoutMeeples();
  return await wait(200,gid);
}
async function afterMove(p,gid){
  G.phase='moving';
  const ok=await applyJump(p,gid);if(!ok)return;
  if(p.pos===G.b.cols*G.b.rows){p.rank=++G.rankN;say(`${p.name} 도착! ${p.rank}등이에요.`);hop(p);}
  nextTurn();
}
function nextTurn(){
  const alive=G.players.filter(q=>!q.rank);
  if(alive.length<=1){
    if(alive.length===1){alive[0].rank=++G.rankN;}
    G.phase='over';markTarget(0);say('마지막 한 명이 남아서 게임이 끝났어요.');syncAll();showOver();return;
  }
  let i=G.turn;do{i=(i+1)%G.players.length;}while(G.players[i].rank);
  G.turn=i;G.phase='idle';say(`${G.players[i].name}의 차례예요. 주사위를 굴려 보세요.`);syncAll();
}
async function doRoll(){
  if(!G)return;
  if(G.phase==='setup'){say('오른쪽의 "게임 시작" 버튼을 먼저 눌러 주세요.');return;}
  if(G.phase!=='idle')return;
  const gid=G.id,p=G.players[G.turn];
  G.phase='rolling';syncAll();
  const dice=$('#dice'),els=$$('.die',dice);dice.classList.add('rolling');
  const t0=performance.now(),dur=RM?150:850;
  while(performance.now()-t0<dur){els.forEach(d=>setDie(d,1+Math.floor(Math.random()*6)));if(!await wait(70,gid))return;}
  const vals=els.map(()=>1+Math.floor(Math.random()*6));
  els.forEach((d,i)=>setDie(d,vals[i]));dice.classList.remove('rolling');
  G.diceVals=vals;const total=vals.reduce((a,b)=>a+b,0);
  say(`${p.name}: ${vals.length>1?vals.join(' + ')+' = '+total:total}`);
  if(!await wait(450,gid))return;
  const N=G.b.cols*G.b.rows,plan=planMove(p.pos,total,N,setup.finish);G.plan=plan;
  if(setup.mode==='auto'){
    G.phase='moving';syncDice();
    if(!await walk(p,plan.path,gid))return;
    await afterMove(p,gid);
  }else{
    G.phase='manual';G.dest=plan.dest;markTarget(plan.dest);syncAll();
    say(`${p.name}의 말을 ${plan.dest}번 칸으로 옮겨 주세요. 끌어다 놓거나 반짝이는 칸을 눌러요.`);
  }
}
async function commitManual(){
  if(!G||G.phase!=='manual')return;
  const gid=G.id,p=G.players[G.turn];G.phase='moving';markTarget(0);
  p.el.classList.remove('notrans','dragging');p.override=null;p.pos=G.plan.dest;layoutMeeples();hop(p);syncDice();
  if(!await wait(380,gid))return;
  await afterMove(p,gid);
}
async function switchToAuto(){
  const gid=G.id,p=G.players[G.turn];
  drag=null;markTarget(0);p.el.classList.remove('dragging','notrans');p.override=null;layoutMeeples();
  G.phase='moving';say(`${p.name}의 말이 자동으로 걸어가요.`);syncAll();
  if(!await walk(p,G.plan.path,gid))return;
  await afterMove(p,gid);
}
function manualCell(n){
  if(!G||G.phase!=='manual'||!n)return;
  if(n===G.dest)commitManual();else say(`${G.players[G.turn].name}의 말은 반짝이는 ${G.dest}번 칸으로 가야 해요.`);
}
let drag=null,suppressClick=false;
function attachDrag(p){
  const el=p.el;
  el.addEventListener('pointerdown',e=>{
    if(!G||G.phase!=='manual'||G.players[G.turn]!==p)return;
    e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(x){}
    drag={p,id:e.pointerId,sx:e.clientX,sy:e.clientY,moved:false};el.classList.add('notrans','dragging');
  });
  el.addEventListener('pointermove',e=>{
    if(!drag||drag.p!==p||drag.id!==e.pointerId)return;
    if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>5)drag.moved=true;
    const host=$('#pb'),r=host.getBoundingClientRect(),b=G.b;
    const fx=(e.clientX-r.left-host.clientLeft)/host.clientWidth,fy=(e.clientY-r.top-host.clientTop)/host.clientHeight;
    p.override={x:fx*b.cols*100,y:fy*b.rows*100-6};place(p,p.override.x,p.override.y+6,1.1);
  });
  const end=e=>{
    if(!drag||drag.p!==p||drag.id!==e.pointerId)return;
    const d=drag;drag=null;el.classList.remove('dragging');
    if(d.moved){
      suppressClick=true;setTimeout(()=>{suppressClick=false;},0);
      const n=cellFromEvent(e,$('#pb'),G.b);
      if(n===G.dest){commitManual();return;}
      el.classList.remove('notrans');p.override=null;layoutMeeples();
      say(n?`${p.name}의 말은 반짝이는 ${G.dest}번 칸으로 가야 해요.`:'판 안의 칸에 놓아 주세요.');
    }else{el.classList.remove('notrans');}
  };
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',e=>{if(drag&&drag.p===p){drag=null;el.classList.remove('dragging','notrans');p.override=null;layoutMeeples();}});
}
function showOver(){
  const list=G.players.slice().sort((a,b)=>a.rank-b.rank);
  $('#modalBody').innerHTML=`<h2>게임 끝!</h2><ol class="rank-list">${list.map(p=>`<li><b>${p.rank}등</b><span class="av">${charSVG(p.char)}</span>${esc(p.name)}</li>`).join('')}</ol><div class="btnrow"><button type="button" class="btn primary" data-act="newgame">한 번 더</button><button type="button" class="btn" data-act="modal-close">닫기</button></div>`;
  $('#modal').hidden=false;const f=$('#modalBody .btn');if(f)f.focus();
}

/* ================= 이벤트 ================= */
function setTab(t){
  ui.tab=t;$('#viewEdit').hidden=t!=='edit';$('#viewPlay').hidden=t!=='play';
  $('#tabEdit').setAttribute('aria-selected',String(t==='edit'));$('#tabPlay').setAttribute('aria-selected',String(t==='play'));
  if(t==='play'){if(!G||G.phase==='setup'){buildGame();drawPlayBoard();}drawPlayPanel();}
}
function applyZoom(z){ui.zoom=z;document.documentElement.style.setProperty('--zoom',z);$$('.zoomr').forEach(r=>{r.value=z;});}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(t){act(t.dataset.act,t);return;}
  const eb=e.target.closest('#eb');
  if(eb){const c=e.target.closest('.cell');if(c&&ui.tool!=='paint')onEditCell(+c.dataset.n);return;}
  const pb=e.target.closest('#pb');
  if(pb&&G){
    if(suppressClick)return;
    if(e.target.closest('#dice.can')){doRoll();return;}
    if(G.phase==='manual')manualCell(cellFromEvent(e,$('#pb'),G.b));
  }
});
function act(a,t){
  switch(a){
    case 'tab':setTab(t.dataset.v);break;
    case 'tool':ui.tool=t.dataset.v;ui.pend=null;syncTools();renderEditBoard();drawToolBody();break;
    case 'step':{const k=t.dataset.k,d=+t.dataset.d;
      if(k==='cols'||k==='rows')setDim(k,board[k]+d);
      else if(k==='n'){setup.n=clamp(setup.n+d,2,11);ui.pick=null;afterSetupChange();}
      else if(k==='dice'){setup.dice=clamp(setup.dice+d,1,6);afterSetupChange();}
      break;}
    case 'ins-prev':selectCell(ui.sel-1);break;
    case 'ins-next':selectCell(ui.sel+1);break;
    case 'ins-icon':board.cells[ui.sel-1].i=t.dataset.v;save();renderEditBoard();drawToolBody();break;
    case 'ins-color':board.cells[ui.sel-1].c=t.dataset.v;save();renderEditBoard();drawToolBody();break;
    case 'ins-clear':board.cells[ui.sel-1]={t:'',i:'',c:''};save();renderEditBoard();drawToolBody();break;
    case 'paint-color':ui.paint=t.dataset.v;drawToolBody();break;
    case 'pattern':applyPattern(t.dataset.v);break;
    case 'jcolor':if(ui.tool==='snake')ui.snakeColor=t.dataset.v;else ui.ladderColor=t.dataset.v;drawToolBody();break;
    case 'pend-cancel':ui.pend=null;renderEditBoard();drawToolBody();break;
    case 'jdel':board.jumps=board.jumps.filter(j=>j.id!==+t.dataset.id);save();renderEditBoard();drawJumpList();updateInfo();break;
    case 'bulk-load':$('#bulkT').value=board.cells.map(c=>c.t).join('\n');break;
    case 'bulk-apply':{
      const lines=$('#bulkT').value.split('\n'),N=board.cells.length;
      lines.slice(0,N).forEach((s,i)=>{board.cells[i].t=s.slice(0,80);});
      save();renderEditBoard();drawToolBody();msgE(`${Math.min(lines.length,N)}칸에 글을 넣었어요.`,'good');break;}
    case 'exp-make':{const s=JSON.stringify(board);$('#expT').value=s;try{navigator.clipboard.writeText(s).then(()=>msgE('복사했어요.','good'),()=>msgE('아래 글자를 직접 복사해 주세요.'));}catch(x){msgE('아래 글자를 직접 복사해 주세요.');}break;}
    case 'exp-load':{
      let o=null;try{o=JSON.parse($('#expT').value);}catch(x){}
      const nb=sanitizeBoard(o);if(!nb){msgE('읽을 수 없는 데이터예요. 내보내기로 만든 글자를 붙여 넣어 주세요.','bad');break;}
      board=nb;ui.sel=null;ui.pend=null;save();drawEditAll();msgE('판을 불러왔어요.','good');break;}
    case 'reset-sample':board=sampleBoard();ui.sel=null;ui.pend=null;save();drawEditAll();msgE('예시 판을 불러왔어요.');break;
    case 'reset-blank':board=blankBoard();ui.sel=null;ui.pend=null;save();drawEditAll();msgE('백지 판으로 비웠어요.');break;
    /* 게임 */
    case 'pl-pick':{const i=+t.dataset.i;ui.pick=ui.pick===i?null:i;drawPlayPanel();break;}
    case 'pl-char':{
      const i=+t.dataset.i,k=+t.dataset.k,j=setup.players.findIndex(p=>p.char===k);
      if(j!==i&&j>=0){const tmp=setup.players[i].char;setup.players[i].char=k;setup.players[j].char=tmp;}
      ui.pick=null;afterSetupChange();break;}
    case 'pl-up':{const i=+t.dataset.i;if(i>0){const a=setup.players;[a[i-1],a[i]]=[a[i],a[i-1]];ui.pick=null;afterSetupChange();}break;}
    case 'pl-down':{const i=+t.dataset.i;if(i<setup.n-1){const a=setup.players;[a[i+1],a[i]]=[a[i],a[i+1]];ui.pick=null;afterSetupChange();}break;}
    case 'shuffle':{const head=setup.players.slice(0,setup.n),rest=setup.players.slice(setup.n);for(let i=head.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[head[i],head[j]]=[head[j],head[i]];}setup.players=head.concat(rest);ui.pick=null;afterSetupChange();break;}
    case 'mode':{
      setup.mode=t.dataset.v;save();drawPlayPanel();
      if(G&&G.phase==='manual'&&setup.mode==='auto'){switchToAuto();}
      else if(G&&G.phase!=='setup'&&G.phase!=='over'){say(setup.mode==='auto'?'다음 차례부터 자동으로 걸어가요.':'다음 차례부터 직접 옮겨요.');}
      break;}
    case 'start':
      if(!G||G.phase!=='setup')break;
      G.players.forEach((p,i)=>{p.name=displayName(setup.players[i]);if(p.el)p.el.title=p.name;});
      G.phase='idle';G.turn=0;G.log=[];say(`${G.players[0].name}부터 시작해요. 주사위를 굴려 보세요!`);
      syncAll();break;
    case 'roll':doRoll();break;
    case 'newgame':$('#modal').hidden=true;ui.pick=null;buildGame();drawPlayBoard();drawPlayPanel();break;
    case 'modal-close':$('#modal').hidden=true;break;
  }
}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='ins-t'&&ui.sel){board.cells[ui.sel-1].t=t.value;save();renderEditBoard();}
  else if(t.id==='ins-custom'&&ui.sel){board.cells[ui.sel-1].c=t.value;save();renderEditBoard();}
  else if(t.id==='paint-custom'){ui.paint=t.value;}
  else if(t.id==='jcolor-custom'){if(ui.tool==='snake')ui.snakeColor=t.value;else ui.ladderColor=t.value;}
  else if(t.classList.contains('jcol')){const j=board.jumps.find(x=>x.id===+t.dataset.id);if(j){j.color=t.value;save();renderEditBoard();}}
  else if(t.classList.contains('pname')){setup.players[+t.dataset.i].name=t.value;save();}
  else if(t.classList.contains('zoomr')){applyZoom(+t.value);}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='startSel'){board.startRight=t.value==='R';save();renderEditBoard();}
  else if(t.id==='finishSel'){setup.finish=t.value==='exact'?'exact':'pass';save();}
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(t.id==='ins-t'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(ui.sel<board.cells.length)selectCell(ui.sel+1);return;}
  if(e.key==='Escape'){if(!$('#modal').hidden)$('#modal').hidden=true;else if(ui.pend){ui.pend=null;renderEditBoard();drawToolBody();}}
  if((e.key==='Enter'||e.key===' ')&&t.id==='dice'){e.preventDefault();doRoll();}
});
/* 색칠 도구: 끌어서 칠하기 */
document.addEventListener('pointerdown',e=>{
  const eb=e.target.closest('#eb');if(!eb||ui.tool!=='paint')return;
  painting=true;lastPaint=0;paintAt(e);try{eb.setPointerCapture(e.pointerId);}catch(x){}
});
document.addEventListener('pointermove',e=>{if(painting)paintAt(e);});
function endPaint(){if(painting){painting=false;lastPaint=0;save();}}
document.addEventListener('pointerup',endPaint);document.addEventListener('pointercancel',endPaint);

/* ---------- 시작 ---------- */
load();applyZoom(1);drawEditAll();
window.__snl={get board(){return board;},get setup(){return setup;},get G(){return G;},planMove,cellAt,center,nToRC};
})();
</script>
